<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>StockRank USA</title>

  <style>
    :root {
      --background: #080808;
      --surface: #111111;
      --surface-light: #191919;
      --border: #292929;
      --red: #e50914;
      --red-light: #ff3945;
      --text: #f5f5f5;
      --muted: #999999;
      --green: #45df91;
      --yellow: #ffc857;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(229, 9, 20, 0.16), transparent 35%),
        var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 34px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--red), #740006);
      color: white;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 0 28px rgba(229, 9, 20, 0.35);
    }

    h1 {
      font-size: clamp(1.7rem, 3vw, 2.5rem);
      letter-spacing: -1px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 7px;
      font-size: 0.95rem;
    }

    .last-update {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: right;
      padding-top: 8px;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 24px;
      padding: 18px;
      background: rgba(17, 17, 17, 0.88);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .exchange-buttons {
      display: flex;
      gap: 10px;
    }

    button {
      border: 1px solid #4a4a4a;
      border-radius: 10px;
      padding: 11px 22px;
      color: var(--text);
      background: var(--surface-light);
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      border-color: var(--red-light);
      transform: translateY(-1px);
    }

    button.active {
      border-color: var(--red);
      background: linear-gradient(135deg, var(--red), #9c0008);
      box-shadow: 0 0 18px rgba(229, 9, 20, 0.3);
    }

    .refresh-button {
      background: transparent;
      color: var(--red-light);
      border-color: var(--red);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

      padding: 20px;
